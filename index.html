<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A keyboard mining game for high school chemistry. Dig for element ores and return them to base.">
  <title>Loading</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230072B2'/%3E%3Cpath d='M8 2l3 6H5z' fill='%23F0E442'/%3E%3C/svg%3E">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #12141a;
      overscroll-behavior: none;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="600">A keyboard mining game. Turn on JavaScript to play.</canvas>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  <noscript>This game needs JavaScript. It runs in the browser and does not use the network.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
